# SonarQube: static analysis for bugs, code smells and security hotspots.
# Run a scan with the steps in the Code Review page of the project Wiki.
sonar.projectKey=apartment-management
sonar.projectName=Apartment Management
sonar.sourceEncoding=UTF-8

# Application code
sonar.sources=packages/shared/src,server/src,server/prisma,web/src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/migrations/**,**/locales/*.json

# Test code (analysed as tests, not counted as application code)
sonar.tests=packages/shared/src,server/test,web/src,e2e,e2e-pwa
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,server/test/**/*.ts,e2e/**/*.ts,e2e-pwa/**/*.ts

# Unit-test coverage from `npm run test:coverage` (Vitest, lcov format)
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,packages/shared/coverage/lcov.info
# The web app is tested through the browser (Playwright, e2e/), which line coverage does not measure;
# demo seed scripts are not application code.
sonar.coverage.exclusions=web/**,server/prisma/**
