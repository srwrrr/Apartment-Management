<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f5c4d" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f8f7; color: #16201d; font-family: system-ui, 'Noto Sans Bengali', 'Noto Sans', sans-serif; line-height: 1.5; text-align: center; }
      main { padding: 24px; max-width: 26rem; }
      h1 { margin: 0 0 8px; font-size: 1.6rem; color: #0f5c4d; }
      p { margin: 0 0 20px; }
      button { min-height: 44px; padding: 8px 24px; border: 0; border-radius: 8px; background: #0f5c4d; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Check your internet connection and try again.</p>
      <h1 lang="bn">আপনি অফলাইনে আছেন</h1>
      <p lang="bn">আপনার ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>
      <button type="button" onclick="location.reload()">Try again / আবার চেষ্টা করুন</button>
    </main>
  </body>
</html>
